name: CI

on:
  push:
    branches: [ main, develop, '001-*' ]
  pull_request:
    branches: [ main ]
  # The Dependabot auto-merge job starts this on main: merges made with
  # GITHUB_TOKEN do not trigger push workflows, so main was never tested or deployed.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run TypeScript check
      run: npm run typecheck
    
    - name: Run linter
      run: npm run lint
    
    - name: Run tests
      run: npm run test -- --run
    
    - name: Build
      run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    # Test the production build, the same files that deploy to Pages
    - name: Build
      run: npm run build

    - name: Run e2e tests
      run: npm run test:e2e -- --reporter=list
      env:
        PW_PREVIEW: '1'

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # One Pages deploy at a time; do not cancel a deploy in progress
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: |
        npm run build
        touch dist/.nojekyll
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Auto-merge Dependabot patch & minor updates once CI is green.
  # Gated purely by `needs: [test, e2e]` — this job is skipped if either fails,
  # so CI is the merge gate (no branch protection required). Major bumps are
  # never auto-merged: they fall through the version-type guard for manual review.
  dependabot-auto-merge:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - name: Fetch Dependabot metadata
      id: meta
      uses: dependabot/fetch-metadata@v2

    - name: Merge patch & minor updates
      if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
      run: |
        gh pr merge --merge "$PR_URL"
        # A GITHUB_TOKEN merge starts no push workflows, so run CI (test + deploy) on main
        gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
